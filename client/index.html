<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura — Personal Colour Analysis</title>
    <meta
      name="description"
      content="Upload one photo. Your skin, hair and eyes are measured in your browser and matched against the twelve colour seasons — your palette, makeup shades, metals and gemstones."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0C0A09" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Translucent, so the app's own ground colour runs under the status bar
         rather than leaving a white band above it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The Latin faces are self-hosted (src/styles/fonts.css). These two are
         what the first screen is set in, so they start downloading with the
         HTML instead of after the CSS that names them has been parsed. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/src/assets/fonts/cormorant-garamond-300-600-latin.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/src/assets/fonts/archivo-400-600-latin.woff2"
    />
    <!-- Arabic only, and only ever used under [dir="rtl"]. Requested as a print
         stylesheet so it never blocks rendering, then switched on once loaded. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Amiri:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Amiri:wght@400;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
